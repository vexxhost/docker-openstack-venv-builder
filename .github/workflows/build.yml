name: build

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - stable/**

jobs:
  image:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            image-name: openstack-venv-builder-ubuntu
            from: ghcr.io/vexxhost/python-base-ubuntu:zed@sha256:98962547f946a3c902343f978145dbdfc7f2c960188d21a0a1a55e11bbff49ff
          - name: ubuntu-cloud-archive
            image-name: openstack-venv-builder-ubuntu-cloud-archive
            from: ghcr.io/vexxhost/python-base-ubuntu-cloud-archive:zed@sha256:88ea222c52d19a23baab8e79d85f85364162b57e47c6ca30553d8bdb4b3dc86c
          - name: ubuntu-cloud-archive-legacy
            image-name: openstack-venv-builder
            from: ghcr.io/vexxhost/python-base:zed@sha256:781f955519c2f8297b9dafefd310ee00dd6986e631c89f7e58c887048e84784c
          - name: debian
            image-name: openstack-venv-builder-debian
            from: ghcr.io/vexxhost/python-base-debian:zed@sha256:449ed70e5ffba625014acff322b25f23ecddeb53d2e63171247552304ce9a4d8
          - name: rockylinux
            image-name: openstack-venv-builder-rockylinux
            from: ghcr.io/vexxhost/python-base-rockylinux:zed@sha256:1ed18f06ddf8aef1ef36fb125a6b8f3e0557d406b7e6827604f52840ea7b92a6
          - name: almalinux
            image-name: openstack-venv-builder-almalinux
            from: ghcr.io/vexxhost/python-base-almalinux:zed@sha256:c036d51b40fb339460acfffcb038b35e12dbcbab99bef8a1edc37111032b07fc
    permissions:
      contents: read
      id-token: write
      packages: write
      pull-requests: write
    steps:
      - uses: vexxhost/docker-atmosphere/.github/actions/checkout@e22141dfd5b75c4109fab95427441cfa762bc770 # main
        with:
          repository: vexxhost/requirements
          ref: 54917f57f3911173bc12e17897ad4cce9da382d9 # stable/zed

      - uses: vexxhost/docker-atmosphere/.github/actions/build-image@e22141dfd5b75c4109fab95427441cfa762bc770 # main
        with:
          image-name: ${{ matrix.image-name }}
          build-contexts: requirements=vexxhost/requirements
          build-args: FROM=${{ matrix.from }}
          push: ${{ github.event_name != 'pull_request' }}
